app-id: io.github.hamzaless.Nitor
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: nitor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # DDC/CI needs raw access to /dev/i2c-*
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/gtk-doc

modules:
  - name: jansson
    buildsystem: cmake-ninja
    config-opts:
      - -DJANSSON_BUILD_DOCS=OFF
    sources:
      - type: archive
        url: https://github.com/akheron/jansson/releases/download/v2.14/jansson-2.14.tar.gz
        sha256: 5798d010e41cf8d76b66236cfb2f2543c8d082181d16bc3085ab49538d4b9929

  - name: ddcutil
    buildsystem: autotools
    config-opts:
      - --disable-usb
      - --disable-x11
      - --disable-doxygen
      - --disable-testcases
    sources:
      - type: git
        url: https://github.com/rockowitz/ddcutil.git
        tag: v2.2.1

  - name: nitor
    buildsystem: simple
    build-commands:
      - install -d /app/share/nitor
      - cp -r nitor /app/share/nitor/nitor
      - install -Dm755 packaging/flatpak/nitor.sh /app/bin/nitor
      - install -Dm644 data/io.github.hamzaless.Nitor.desktop /app/share/applications/io.github.hamzaless.Nitor.desktop
      - install -Dm644 data/io.github.hamzaless.Nitor.metainfo.xml /app/share/metainfo/io.github.hamzaless.Nitor.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.hamzaless.Nitor.svg /app/share/icons/hicolor/scalable/apps/io.github.hamzaless.Nitor.svg
    sources:
      - type: dir
        path: ../..
